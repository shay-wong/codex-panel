[package]
name = "codex-panel-launcher"
version = "0.1.0"
description = "Codex Panel macOS launcher"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
libc = "0.2"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
