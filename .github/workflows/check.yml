name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-check:
    name: Typecheck and tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  main-check-scope:
    name: Select Check scope
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.native-scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select native checks from changed paths
        id: native-scope
        env:
          CHECK_EVENT: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
          let runNative = true;
          try {
            if (process.env.CHECK_EVENT === 'pull_request') {
              const paths = git('diff', '--name-only', '--no-renames', '-z', 'HEAD^1', 'HEAD').split('\0').filter(Boolean);
              runNative = !paths.every(path =>
                path.startsWith('web/src/') || path === 'web/index.html' ||
                (path.startsWith('web/public/') && path !== 'web/public/codex-app-icon.png') ||
                path.startsWith('docs/') ||
                /^(?:README(?:\.[^/]+)?\.md|CHANGELOG(?:\.[^/]+)?\.md|FORK\.md|AGENTS\.md|LICENSE(?:\.[^/]+)?)$/.test(path));
            }
          } catch (error) {
            console.log(`Cannot determine changed paths; run native checks: ${error.message}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run_native=${runNative}\n`);
          console.log(runNative ? 'Native/runtime/build inputs changed or range unknown: run Rust checks.' : 'Web/docs-only change: run the ordinary Check, skip native compilation.');
          NODE

  check:
    needs: main-check-scope
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-launcher:
    name: macOS Rust check
    needs: main-check-scope
    if: ${{ !cancelled() && github.event_name != 'push' && needs['main-check-scope'].outputs.run_native != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # 编译检查不生成安装包；正式 tag 构建继续使用真实资源和完整性清单。
      TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":{}}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-check
          cache-bin: false
      - name: Prepare compile-only fixtures
        shell: bash
        run: |
          mkdir -p src-tauri/resources dist/launcher
          printf '%s' '{"version":1,"files":[]}' > src-tauri/resources/runtime-integrity.json
          printf '%s' '<!doctype html><title>Compile check</title>' > dist/launcher/index.html
      - name: Check Rust targets (aarch64-apple-darwin)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target aarch64-apple-darwin
      - name: Check Rust targets (x86_64-apple-darwin)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target x86_64-apple-darwin

  windows-launcher:
    name: Windows x64 Rust check
    needs: main-check-scope
    if: ${{ !cancelled() && github.event_name != 'push' && needs['main-check-scope'].outputs.run_native != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # 编译检查不生成安装包；正式 tag 构建继续使用真实资源和完整性清单。
      TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":{}}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-check
          cache-bin: false
      - run: npm ci
      - name: Run the Windows Node.js test suite
        run: npm test
      - name: Prepare compile-only fixtures
        shell: bash
        run: |
          mkdir -p src-tauri/resources dist/launcher
          printf '%s' '{"version":1,"files":[]}' > src-tauri/resources/runtime-integrity.json
          printf '%s' '<!doctype html><title>Compile check</title>' > dist/launcher/index.html
      - name: Check Rust targets (x86_64-pc-windows-msvc)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target x86_64-pc-windows-msvc

  linux-launcher:
    name: Ubuntu x64 Rust check
    needs: main-check-scope
    if: ${{ !cancelled() && github.event_name != 'push' && needs['main-check-scope'].outputs.run_native != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 编译检查不生成安装包；正式 tag 构建继续使用真实资源和完整性清单。
      TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":{}}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-check
          cache-bin: false
      - name: Install Rust check system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Prepare compile-only fixtures
        shell: bash
        run: |
          mkdir -p src-tauri/resources dist/launcher
          printf '%s' '{"version":1,"files":[]}' > src-tauri/resources/runtime-integrity.json
          printf '%s' '<!doctype html><title>Compile check</title>' > dist/launcher/index.html
      - name: Check Rust targets (x86_64-unknown-linux-gnu)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target x86_64-unknown-linux-gnu
