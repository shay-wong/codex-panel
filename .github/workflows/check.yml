name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Classify check source
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.classify.outputs.run_checks }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_shas="$(gh api \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .merge_commit_sha')"

          if grep -Fxq "$GITHUB_SHA" <<<"$merge_shas"; then
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: source
    if: needs.source.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-launcher:
    name: macOS launcher
    needs: source
    if: needs.source.outputs.run_checks == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run app:prepare -- --target universal-apple-darwin
      - name: Build the unsigned universal app bundle
        run: >-
          npm run tauri -- build
          --target universal-apple-darwin
          --bundles app
          --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: test -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"
      - name: Verify packaged panelctl and inherited listener
        run: >-
          npm run app:verify-packaged-panelctl --
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"
      - name: Ad-hoc sign the launcher for bundle verification
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          /usr/bin/codesign --force --options runtime --entitlements src-tauri/Entitlements.plist --sign - "$APP/Contents/MacOS/$EXECUTABLE"
          /usr/bin/codesign --force --options runtime --entitlements src-tauri/Entitlements.plist --sign - "$APP"
      - name: Verify the Tauri app bundle
        run: >-
          npm run app:preflight --
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"

  windows-launcher:
    name: Windows x64 launcher
    needs: source
    if: needs.source.outputs.run_checks == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Run the Windows Node.js test suite
        run: npm test
      - name: Build the unsigned NSIS installer
        run: npm run app:build:windows:unsigned
      - name: Preserve the unsigned NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux-launcher:
    name: Ubuntu 24.04 x64 launcher
    needs: source
    if: needs.source.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - run: npm ci
      - name: Build the Ubuntu 24.04 x64 packages
        run: npm run app:build:linux:x64
      - name: Verify the Ubuntu 24.04 x64 package contents
        run: >-
          node scripts/verify-linux-packages.mjs
          src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
      - name: Preserve the Ubuntu 24.04 x64 packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-deb-appimage-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
