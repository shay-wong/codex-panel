name: Windows latest package
on:
  push:
    branches: [build/windows-0.5.0-latest]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CODEX_PANEL_ALLOW_UNSIGNED_WINDOWS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: windows-package
          cache-bin: false
      - run: npm ci
      - run: npm run app:prepare -- --target x86_64-pc-windows-msvc
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked node_resource_path_uses_safe_windows_spelling
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked runtime_integrity_rejects_modified_and_unlisted_runtime_files
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked windows_open::tests::shell_status_is_not_a_process_exit_code
      - run: npm run app:build:windows:unsigned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-0.5.0-latest
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
