name: Release macOS and Windows

on:
  push:
    tags:
      - "v*-fork"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-version:
    needs: release
    if: github.repository == 'shay-wong/codex-panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-version-main
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Commit published version to main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" HEAD
          VERSION=${RELEASE_TAG#v}
          CURRENT=$(node -p 'require("./package.json").version')
          # 较旧发布的重跑不能把 main 的版本降回去。
          if [ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "main already has a newer version: $CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/prepare-fork-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/version-sync-notes.md" --archive-changelog
          git add -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md CHANGELOG.zh-CN.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: sync published version $RELEASE_TAG [skip ci]"
          git push origin HEAD:main
          echo "Synced $RELEASE_TAG to main" >> "$GITHUB_STEP_SUMMARY"

  announce-channel:
    needs: release
    uses: ./.github/workflows/telegram-release-channel.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PACKAGE_CHAT_ID: ${{ secrets.TELEGRAM_PACKAGE_CHAT_ID }}

  release:
    if: github.repository == 'shay-wong/codex-panel'
    needs: release-windows
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CODEX_PANEL_UPDATER_PUBLIC_KEY: ${{ vars.CODEX_PANEL_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare version from tag and validate signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$CODEX_PANEL_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/prepare-fork-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Check release metadata and updater signatures
        run: node --test test/prepare-fork-release.test.mjs test/release-metadata.test.mjs test/updater-signature.test.mjs
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-universal
          cache-bin: false
      - run: npm run app:prepare -- --target universal-apple-darwin
      - name: Build universal App without Apple credentials
        run: >-
          npm run tauri -- build --target universal-apple-darwin --bundles app
          --no-sign --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Ad-hoc sign and verify App
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          codesign --force --options runtime --entitlements src-tauri/Entitlements.plist --sign - "$APP/Contents/MacOS/$EXECUTABLE"
          codesign --force --options runtime --entitlements src-tauri/Entitlements.plist --sign - "$APP"
          npm run app:preflight -- "$APP"
          npm run app:verify-packaged-panelctl -- "$APP"
      - name: Package DMG and sign updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Panel.app"
          mkdir -p "$RUNNER_TEMP/dmg-content" "$RUNNER_TEMP/release-assets"
          ditto "$APP" "$RUNNER_TEMP/dmg-content/Codex Panel.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-content/Applications"
          hdiutil create -volname "Codex Panel" -srcfolder "$RUNNER_TEMP/dmg-content" -ov -format UDZO "$RUNNER_TEMP/release-assets/$RELEASE_DMG"
          hdiutil verify "$RUNNER_TEMP/release-assets/$RELEASE_DMG"
          node scripts/create-macos-updater.mjs "$APP" "$RUNNER_TEMP/release-assets" "$RELEASE_TAG"
          test -s "$RUNNER_TEMP/release-assets/$RELEASE_ARCHIVE"
          test -s "$RUNNER_TEMP/release-assets/$RELEASE_ARCHIVE.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify and merge Windows updater
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          export RELEASE_WINDOWS="Codex.Panel_${VERSION}_x86_64-setup.exe"
          echo "RELEASE_WINDOWS=$RELEASE_WINDOWS" >> "$GITHUB_ENV"
          node scripts/merge-windows-updater.mjs "$RUNNER_TEMP/release-assets/latest.json" "$RUNNER_TEMP/release-assets/$RELEASE_WINDOWS" "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          Windows x64 安装器带 Authenticode 签名，支持通过 Tauri 更新密钥验证的应用内更新。旧测试版需先手动安装一次。

          macOS 通用版，支持 Apple Silicon 与 Intel。此版本使用临时签名，未经 Apple 公证；首次打开可能需要在“系统设置 → 隐私与安全性”中允许打开。更新包使用 Codex Panel 独立密钥签名验证。

          已有本地 0.1.0 开发版需手动安装一次，以切换到独立 Fork 版本线。

          Universal macOS build for Apple Silicon and Intel. Ad-hoc signed, not Apple-notarized; first launch may require allowing the app in System Settings → Privacy & Security. Update archives are signed with the Codex Panel updater key.

          Local 0.1.0 development builds require a one-time manual installation to switch to the independent fork version line.
          NOTES
          printf '\n[中文更新日志](https://github.com/%s/blob/%s/CHANGELOG.zh-CN.md) · [Changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --draft --title "Codex Panel $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets/$RELEASE_DMG" "$RUNNER_TEMP/release-assets/$RELEASE_ARCHIVE" "$RUNNER_TEMP/release-assets/$RELEASE_ARCHIVE.sig" "$RUNNER_TEMP/release-assets/latest.json" "$RUNNER_TEMP/release-assets/$RELEASE_WINDOWS" "$RUNNER_TEMP/release-assets/$RELEASE_WINDOWS.sig"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' | jq -s --arg tag "$RELEASE_TAG" 'map(select(.tag_name == $tag and .draft == true)) | if length == 1 then .[0] else error("Expected one draft release") end' > "$RUNNER_TEMP/uploaded-assets.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { assets } = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/uploaded-assets.json`, 'utf8'));
          const names = new Set(assets.map((asset) => asset.name));
          for (const name of [process.env.RELEASE_DMG, process.env.RELEASE_ARCHIVE, `${process.env.RELEASE_ARCHIVE}.sig`, process.env.RELEASE_WINDOWS, `${process.env.RELEASE_WINDOWS}.sig`, 'latest.json']) assert.ok(names.has(name), `Missing release asset: ${name}`);
          assert.ok(assets.every((asset) => asset.state === 'uploaded' && asset.size > 0));
          NODE
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,tagName

      # Send Telegram notification
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          if [ -n "$RELEASE_TAG" ]; then
            TAG_NAME=${RELEASE_TAG#refs/tags/}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_NAME#v}
          TAG_HASHTAG=$(printf '%s' "$TAG_NAME" | sed 's/[^[:alnum:]_]/_/g')
          TAG_HASHTAG=${TAG_HASHTAG//_/\\_}
          REPO="$GITHUB_REPOSITORY"

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG_NAME")"
          TAG_MESSAGE="${TAG_MESSAGE//_/\\_}"
          TAG_MESSAGE="${TAG_MESSAGE//\*/\\*}"
          TAG_MESSAGE="${TAG_MESSAGE//\`/\\\`}"
          TAG_MESSAGE="${TAG_MESSAGE//\[/\\[}"

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Codex Panel 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          MESSAGE+="• [macOS 通用版下载](https://github.com/${REPO}/releases/download/${TAG_NAME}/${RELEASE_DMG})"$'\n'$'\n'
          MESSAGE+="#CodexPanel #Release #${TAG_HASHTAG}"

          # 发送消息
          curl --silent --show-error --fail-with-body \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')" \
            | jq -e '.ok == true' >/dev/null

  release-windows:
    if: github.repository == 'shay-wong/codex-panel'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CODEX_PANEL_UPDATER_PUBLIC_KEY: ${{ vars.CODEX_PANEL_UPDATER_PUBLIC_KEY }}
      CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Validate Windows signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64 -notmatch '\S' -or $env:WINDOWS_CERTIFICATE_PASSWORD -eq $null) {
            throw '缺少 WINDOWS_CERTIFICATE_PFX_BASE64 或 WINDOWS_CERTIFICATE_PASSWORD'
          }
          if ($env:CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') {
            throw 'CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT 必须是 40 位证书指纹'
          }
          if ($env:CODEX_PANEL_UPDATER_PUBLIC_KEY -notmatch '^dW50cnVzdGVkIGNvbW1lbnQ6') {
            throw '缺少 CODEX_PANEL_UPDATER_PUBLIC_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少 TAURI_SIGNING_PRIVATE_KEY'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codex-panel-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          $certificate = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw '导入的 Windows 签名证书或私钥不匹配' }
          Remove-Item -LiteralPath $pfx
      - run: npm ci
      - name: Prepare release version
        shell: bash
        run: node scripts/prepare-fork-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Build signed Windows updater package
        shell: pwsh
        env:
          CODEX_PANEL_CREATE_UPDATER_ARTIFACTS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run app:build:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows 构建失败' }
          $archives = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($archives.Count -ne 1) { throw '必须恰好生成一个 NSIS 安装器' }
          $archive = $archives[0]
          $authenticode = Get-AuthenticodeSignature $archive.FullName
          if ($authenticode.Status -ne 'Valid' -or $authenticode.SignerCertificate.Thumbprint -ne $env:CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT) { throw '安装器 Authenticode 验证失败' }
          $signature = Get-Item "$($archive.FullName).sig"
          $version = node -p "require('./package.json').version"
          $outputDir = Join-Path $env:RUNNER_TEMP 'windows-release'
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $output = Join-Path $outputDir "Codex.Panel_${version}_x86_64-setup.exe"
          Copy-Item $archive.FullName $output
          Copy-Item $signature.FullName "$output.sig"
          $publicKey = Join-Path $env:RUNNER_TEMP 'updater-public-key.txt'
          Set-Content -Path $publicKey -Value $env:CODEX_PANEL_UPDATER_PUBLIC_KEY -NoNewline
          node scripts/verify-updater-signature.mjs $publicKey $output "$output.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Windows 更新签名验证失败' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
