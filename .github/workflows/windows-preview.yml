name: Windows preview

on:
  push:
    branches:
      - codex/windows-package-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build self-signed Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-preview
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Create self-signed code-signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Codex Panel Self-Signed" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -NotAfter (Get-Date).AddYears(5)
          $thumbprint = $cert.Thumbprint.ToUpperInvariant()
          "CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\Codex.Panel_0.4.18-fork_Windows-x64-self-signed.cer" | Out-Null
          "Self-signed certificate thumbprint: $thumbprint" >> $env:GITHUB_STEP_SUMMARY

      - name: Build self-signed NSIS installer
        run: npm run app:build:windows

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $target = "${env:GITHUB_WORKSPACE}\src-tauri\target\x86_64-pc-windows-msvc\release"
          $launcher = Get-ChildItem -Path $target -Filter "*.exe" -File | Select-Object -First 1
          $installer = Get-ChildItem -Path "$target\bundle\nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $launcher -or $null -eq $installer) { throw "Windows build did not produce the launcher and NSIS installer" }
          foreach ($file in @($launcher, $installer)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $env:CODEX_PANEL_WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Invalid self-signed Authenticode signature: $($file.FullName) ($($signature.Status))"
            }
            "Verified $($file.Name) with $($signature.SignerCertificate.Thumbprint)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload installer and certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-self-signed-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            Codex.Panel_0.4.18-fork_Windows-x64-self-signed.cer
          if-no-files-found: error
          retention-days: 14
